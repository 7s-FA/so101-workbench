<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조립 공정 카메라</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18232e;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:25px;margin:0 0 8px}p{margin:0;color:#506070}button{background:#fff;border:1px solid #9aa8b6;border-radius:6px;padding:12px 18px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.views{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}article{background:white;border:1px solid #d5dde5;border-radius:8px;overflow:hidden}article:first-child{grid-row:span 2;align-self:start}h2{font-size:17px;margin:0}article>div{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}span{font-size:14px;color:#506070}img{display:block;width:100%;aspect-ratio:4/3;background:#e1e6eb;object-fit:contain}footer{margin-top:20px;color:#506070;font-size:14px}@media(max-width:800px){.views{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{padding:16px}}
</style><main><header><div><h1>조립 공정 카메라</h1><p>탑뷰와 두 로봇의 그리퍼 시점 · 640 × 480</p></div><button id="pause" type="button" aria-pressed="false">영상 일시정지</button></header><section class="views" aria-label="실시간 카메라 영상"></section><footer>영상 일시정지는 화면 갱신에만 적용됩니다. 로봇 제어와 시뮬레이션은 계속됩니다. 카메라 위치와 렌즈는 시뮬레이션용 근사값입니다.</footer></main>
<script>
const names={top:'탑뷰 · 두 작업대',so101:'SO-101 · 그리퍼',omx:'OMX · 그리퍼'};let paused=false;
for(const [key,label] of Object.entries(names)){const card=document.createElement('article');card.innerHTML=`<div><h2>${label}</h2><span id="s-${key}" role="status">영상 준비 중</span></div><img id="i-${key}" alt="${label} 영상">`;document.querySelector('.views').append(card)}
document.querySelector('#pause').onclick=function(){paused=!paused;this.textContent=paused?'영상 재개':'영상 일시정지';this.setAttribute('aria-pressed',paused);if(paused)for(const key of Object.keys(names))document.querySelector('#s-'+key).textContent='화면 일시정지'};
async function refresh(){if(!paused){try{const response=await fetch('/state');if(!response.ok)throw Error();const state=await response.json();await Promise.all(Object.keys(names).map(async key=>{const age=state[key]?.age;document.querySelector('#s-'+key).textContent=age==null?'영상 준비 중':age>1?'영상 지연 · '+age.toFixed(1)+'초':'실시간';if(age==null)return;const img=document.querySelector('#i-'+key);await new Promise(resolve=>{img.onload=img.onerror=resolve;img.src='/frame/'+key+'?t='+Date.now()})}))}catch{for(const key of Object.keys(names))document.querySelector('#s-'+key).textContent='시뮬레이터 연결 대기'}}setTimeout(refresh,100)}refresh();
</script></html>
