# SO-101 Ubuntu 티칭 프로그램 통합 설정 (UTF-8 / TOML)
# 이 파일을 수정하고 프로그램을 재시작하면 적용됩니다. 별도 패키지 설치 불필요(Python 3.12).
# 소수점은 점(.)을 사용하세요. 잘못된 이름/범위/자료형은 시작 전에 오류로 안내합니다.
# 보호 설정은 기존 검증 상한 안에서 조정합니다. 모터 구동 속도를 높이는 변경은 포함하지 않습니다.
# robot.json과 calibration/은 등록/보정 도구가 생성하는 로봇 고유 데이터이므로 여기로 복사하지 않습니다.
# 모터 ID/레지스터 주소/패킷 구조/PID·전류·토크 보호값은 사용자 튜닝값이 아닙니다.
# CLI 옵션은 해당 실행에 한해 기본 설정을 덮어씁니다.

[response]
# DEMO에서 팔로워가 목표를 따라가는 속도(도/초). 실제 로봇에 영향 없음. 허용: 0.1~100.
DEMO_RATE = 25.0

# 제어 목표 주파수(Hz). 기존 30. 실제 속도는 USB 통신 시간에 따라 낮아집니다. 허용: 10~200.
CONTROL_HZ = 100

# 화면/이벤트 확인 간격(ms). 기존 50. 작을수록 화면 응답이 빨라집니다. 허용: 5~200.
GUI_POLL_MS = 16

# 전체 모터 건강 검사 간격(초). 기존 보호 주기 0.5초를 유지합니다. 허용: 0.05~0.5.
HEALTH_INTERVAL = 0.5

# 그리퍼 진단 실행 시 건강 검사 간격(초). 허용: 0.05~0.5.
GRIPPER_HEALTH_INTERVAL = 0.2

# GUI 응답이 이 시간(초) 이상 끊기면 정지합니다. 허용: 0.5~2.0.
GUI_HEARTBEAT_TIMEOUT = 2.0

# 동작 승인에 사용할 화면 위치의 최대 나이(초). 허용: 0.05~1.0.
DISPLAY_STALE_SECONDS = 0.5

# 대기 가능한 사용자 명령 개수. STOP은 이 큐를 거치지 않습니다. 허용: 1~100.
COMMAND_QUEUE_SIZE = 20

[motion]
# 몸체 목표 변화율(도/초). 검증된 기존 상한 30 유지. 통신 응답성과 별개입니다. 허용: 0.1~30.0.
COMMAND_RATE = 30.0

# 그리퍼 목표 변화율(정규화 포인트/초, 범위 0~100). 기존 상한 40. 허용: 0.1~40.0.
GRIPPER_COMMAND_RATE = 40.0

# 연결 후 초기 동기화 목표 변화율(도 또는 정규화 포인트/초). 허용: 0.1~5.0.
SYNC_RATE = 5.0

# 지연 후 한 번에 따라잡는 목표 변화량을 제한하는 최대 시간(초). 허용: 0.001~0.05.
MAX_COMMAND_DT = 0.05

# 현재 위치와 명령 목표 사이 최대 차이(도/그리퍼 포인트). 허용: 0.1~30.0.
RELATIVE_TARGET_LIMIT = 30.0

# 초기 동기화 제한 시간(초). 허용: 1~300.
SYNC_TIMEOUT = 90.0

# 단일 이동/재생 각 단계 제한 시간(초). 허용: 1~300.
MOVE_TIMEOUT = 60.0

# 도착 오차 안에서 유지해야 다음 단계로 진행하는 시간(초). 허용: 0.1~5.
ARRIVAL_SETTLE_SECONDS = 0.5

# 동기화 도착 오차(도/그리퍼 포인트). 허용: 0.1~2.
SYNC_ARRIVAL_TOLERANCE = 2.0

# 전체 재생 시 그리퍼 도착 오차(정규화 포인트). 허용: 0.1~10.
PLAY_GRIPPER_ARRIVAL_TOLERANCE = 10.0

# 승인 화면 이후 자세 변경 허용량(도/그리퍼 포인트). 허용: 0.1~2.
PREVIEW_POSE_TOLERANCE = 2.0

# 한 단계 손목 회전 최대 차이(도). 케이블 보호. 허용: 1~90.
WRIST_MOVE_LIMIT = 90.0

# 티칭 시작 시 리더/팔로워 최대 차이(도/그리퍼 포인트). 허용: 0.1~10.
TEACH_START_GAP = 10.0

# 동기화 중 리더가 이 값보다 움직이면 HOLD(도/그리퍼 포인트). 허용: 0.1~5.
SYNC_LEADER_DRIFT = 5.0

[safety]
# 활성화 확인 중 위치 변경 허용량(도/그리퍼 포인트). 허용: 0.1~5.
ACTIVATION_MOVEMENT_LIMIT = 5.0

# 초기 몸체 위치의 보정 범위 초과 허용량(도). 안쪽 방향 이동만 허용. 허용: 0~5.
ENTRY_MARGIN_DEG = 5.0

# 초기 그리퍼 범위 초과 허용량(엔코더 틱). 허용: 0~10.
GRIPPER_ENTRY_MAX_RAW = 10

# 초기 그리퍼 범위 초과 허용량(정규화 포인트). 허용: 0~2.
GRIPPER_ENTRY_MARGIN_UNITS = 2.0

# 활성화 확인의 통신 실패 재시도 횟수. 모터 알람은 재시도하지 않음. 허용: 0~2.
ACTIVATION_READ_RETRIES = 2

# 진행 없이 정체된 상태의 정지 기준(초). 허용: 0.1~4.
STALL_SECONDS = 4.0

# 정체 검사를 시작하는 목표 오차(도/그리퍼 포인트). 허용: 0.1~8.
TRACKING_ERROR = 8.0

# 정체 검사를 시작하는 이전 명령 오차(도/그리퍼 포인트). 허용: 0.1~2.
TRACKING_SENT_ERROR = 2.0

# 진행으로 인정할 최소 엔코더 틱 수. 허용: 1~10.
TRACKING_PROGRESS_TICKS = 2

# 고온 판정 기준(raw 이상). 동작 중에는 아래 지속시간 적용, 시작 전에는 즉시 차단. 허용: 1~65.
TEMPERATURE_LIMIT = 65

# 기준 이상이 연속 유지될 때 중단(초). 관절·측정 경로별, 정상값에서 초기화. 허용: 0.1~5.
TEMPERATURE_DURATION_S = 5.0

# 고온 판정 중 새 측정이 없으면 중단하는 최대 공백(초). 허용: 0.5~1.5.
TEMPERATURE_MAX_GAP_S = 1.5

# 진단에서 활성화 전 요구하는 온도 상한(raw 미만). 허용: 1~40.
COOL_TEMPERATURE_LIMIT = 40

# 단일/블록 온도 차이 경고 기준(raw). 차이만으로 정지하지 않음. 허용: 0~10.
TEMPERATURE_DIFFERENCE_WARNING = 2

[capture]
# 단계 저장 전 안정성 검사에 보관할 위치 기록 길이(초). 허용: 0.1~5.
CAPTURE_HISTORY_SECONDS = 0.8

# 단계 저장에 필요한 최소 안정 시간(초). 허용: 0.1~5.
CAPTURE_STABLE_SECONDS = 0.5

# 안정 상태로 인정할 위치 변화(도/그리퍼 포인트). 허용: 0.01~1.
CAPTURE_POSITION_TOLERANCE = 1.0

# 단계 저장 시 목표와 실제 위치의 최대 오차. 허용: 0.01~2.
CAPTURE_TARGET_TOLERANCE = 2.0

# 티칭 파일 하나의 최대 단계 수. 허용: 1~5000.
MAX_STEPS = 500

# 티칭 제목/단계 이름 최대 글자 수. 허용: 1~200.
MAX_NAME_LENGTH = 80

[logging]
# 오류 분석에 유지할 최근 건강 검사 표본 수. 허용: 1~1000.
HEALTH_HISTORY_SIZE = 20

# 온도 요약 출력/세션 보고서 기록 간격(초). 보호 검사 주기와 별개. 허용: 0.1~60.
TEMPERATURE_LOG_INTERVAL = 10.0

# 관절별 CSV 표본 기록 간격(초). 허용: 0.01~5.
TELEMETRY_LOG_INTERVAL = 0.2

# 일반 CSV 버퍼를 디스크에 전달하는 간격(초). 오류/종료 시 즉시 전달. 허용: 0.05~5.
LOG_FLUSH_INTERVAL = 1.0

# 재생 중 단계 대기 진단 기록 간격(초). 허용: 0.1~10.
PLAYBACK_LOG_INTERVAL = 1.0

# 재생 중 도착 지연 관절의 상세 모터 읽기 간격(초). 허용: 0.5~10.
MOTOR_LOG_INTERVAL = 2.0

# 정지 후 원인 진단의 시간 예산(초). 이미 시작된 읽기는 더 걸릴 수 있음. 허용: 0.1~30.
CAPTURE_SECONDS = 5.0

# 정지 후 원인 진단의 최대 반복 횟수. 허용: 1~100.
CAPTURE_ROUNDS = 10

# 정지 후 진단 반복 사이 간격(초). 허용: 0.01~5.
CAPTURE_INTERVAL = 0.2

[dashboard]
# 진단 창 갱신 간격(ms). 허용: 16~1000.
DASHBOARD_POLL_MS = 100

# 진단 차트에 보관할 표본 수. 허용: 10~5000.
DASHBOARD_HISTORY_SIZE = 180

# 진단 창에 보관할 이벤트 수. 허용: 10~1000.
DASHBOARD_EVENT_SIZE = 80

# 진단 창 대기 표본 수. 오래된 표본부터 제거. 허용: 1~1000.
DASHBOARD_QUEUE_SIZE = 60

# 진단 창에서 오래된 표본으로 표시할 시간(초). 허용: 0.5~10.
DASHBOARD_STALE_SECONDS = 2.0

# 독립 읽기 전용 모니터의 표본 간격(초). 허용: 0.1~5.
READONLY_INTERVAL = 0.5

[diagnostic_cli]
# 어깨 진단 기본 실행 시간(초). CLI 인자로 덮어쓰기 가능. 허용: 0.1~3600.
DIAGNOSTIC_SECONDS = 30.0

# 어깨 진단 기본 제어 주파수(Hz). 허용: 1~100.
DIAGNOSTIC_FPS = 30.0

# 어깨 진단 기본 상세 표본 주파수(Hz). 허용: 0.1~20.
DIAGNOSTIC_TELEMETRY_HZ = 5.0

# 어깨 진단 연속 통신 오류 허용 횟수. 허용: 1~3.
DIAGNOSTIC_MAX_ERRORS = 3

# 어깨 진단 상대 목표 제한(5 또는 7). 허용: 5~7.
DIAGNOSTIC_RELATIVE_TARGET = 5.0

# 온도 모니터 기본 실행 시간(초). 허용: 0.1~3600.
MONITOR_SECONDS = 60.0

# 온도 모니터 기본 표본 주파수(Hz). 허용: 0.1~20.
MONITOR_HZ = 5.0

# 온도 모니터 기본 모터 ID(1~6). 허용: 1~6.
MONITOR_MOTOR_ID = 2

[arrival_tolerances]
# 개별 단계 이동/전체 재생 관절별 도착 오차. 몸체=도, 그리퍼=0~100 포인트.
# shoulder_pan 도착 오차. 허용: 0보다 크고 2.0 이하.
"shoulder_pan.pos" = 2.0
# shoulder_lift 도착 오차. 허용: 0보다 크고 4.0 이하.
"shoulder_lift.pos" = 4.0
# elbow_flex 도착 오차. 허용: 0보다 크고 3.0 이하.
"elbow_flex.pos" = 3.0
# wrist_flex 도착 오차. 허용: 0보다 크고 2.0 이하.
"wrist_flex.pos" = 2.0
# wrist_roll 도착 오차. 허용: 0보다 크고 2.0 이하.
"wrist_roll.pos" = 2.0
# gripper 도착 오차. 허용: 0보다 크고 4.0 이하.
"gripper.pos" = 4.0

[paths]
# 프로그램 폴더 기준 기본 기록 디렉터리. 절대 경로도 가능.
OUTPUT_DIRECTORY = "teaching"
# 독립 진단 도구의 로그 경로(~는 사용자 홈).
DIAGNOSTIC_LOG_DIRECTORY = "~/so101-training/logs"

[appearance]
# 티칭 창의 시작 크기(가로x세로 픽셀).
GUI_GEOMETRY = "1680x900"
# 진단 창의 시작 크기(가로x세로 픽셀).
DASHBOARD_GEOMETRY = "1180x780"
